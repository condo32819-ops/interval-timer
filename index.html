<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;height:100vh;user-select:none}
#round{font-size:9vw;color:#ffd600;font-weight:700}
#round.done{color:#00e676;font-size:12vw}
.setsrow{display:flex;flex-direction:column;align-items:center;width:86vw}
.setshead{display:flex;align-items:baseline;gap:3vw;font-size:5vw;color:#bbb}
#setsval{font-size:13vw;font-weight:700;color:#fff;min-width:12vw;text-align:center}
#sets{width:86vw;height:10vw;accent-color:#ffd600}
#time{font-size:26vw;font-weight:700;font-variant-numeric:tabular-nums}

.adj{background:#333;font-size:12vw;padding:2vw 6vw}

#dur{font-size:8vw;min-width:30vw;text-align:center}
label{font-size:5vw}
.steprow{display:flex;flex-direction:column;align-items:center;gap:2vw}
.steplbl{font-size:5vw;color:#bbb}

</head><body>
<div id="round">Set 1 of 3</div>
<div id="time">1:00</div>
<div class="row"><button class="adj" id="minus">−</button><div id="dur">1:00</div><button class="adj" id="plus">+</button></div>
<div class="steprow"><div class="steplbl">+/− step size</div><div class="seg"><button id="s30">30 sec</button><button id="s60">1 min</button></div></div>
<div class="setsrow"><div class="setshead">Sets <span id="setsval">3</span></div><input type="range" id="sets" min="1" max="10" step="1" value="3" aria-label="Number of sets"></div>
<label><input type="checkbox" id="cd" checked style="transform:scale(2);margin-right:3vw">3-2-1 warning beeps</label>
<div class="row"><button id="start">Start</button><button id="reset">Reset</button></div>
<script>
const MAX=1800;let STEP=30,dur=60,left=60,round=1,sets=3,done=false,running=false,endAt=0,tick=null,lastBeep=-1,ac=null,wl=null;
const $=id=>document.getElementById(id),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function beep(f,ms,vol){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000);}catch(e){}}
function bigBeep(){beep(1000,250,1);setTimeout(()=>beep(1000,250,1),350);setTimeout(()=>beep(1400,600,1),700);if(navigator.vibrate)try{navigator.vibrate([400,150,400,150,600])}catch(e){};}
function finishSound(){[0,180,360].forEach((t,i)=>setTimeout(()=>beep(880+i*220,160,1),t));setTimeout(()=>beep(1760,1500,1),560);if(navigator.vibrate)try{navigator.vibrate([600,200,600,200,1200])}catch(e){};}
function draw(){$('time').textContent=fmt(Math.max(0,Math.ceil(left)));$('round').textContent=done?'Done!':'Set '+round+' of '+sets;$('round').className=done?'done':'';$('setsval').textContent=sets;$('sets').value=sets;if(done)$('time').textContent='0:00';$('dur').textContent=fmt(dur);$('start').textContent=running?'Pause':'Start';$('start').style.background=running?'#ff6d00':'#00c853';$('s30').className=STEP==30?'on':'';$('s60').className=STEP==60?'on':'';}
function loop(){left=(endAt-Date.now())/1000;const s=Math.ceil(left);
 if($('cd').checked&&s<=3&&s>=1&&s!==lastBeep&&dur>3){lastBeep=s;beep(800,120,0.8);}
 if(left<=0){if(round>=sets){finish();return;}bigBeep();round++;endAt+=dur*1000;left=(endAt-Date.now())/1000;lastBeep=-1;}draw();}
function finish(){running=false;clearInterval(tick);done=true;left=0;lastBeep=-1;if(wl){wl.release();wl=null}if(window.Android)Android.keepOn(false);finishSound();draw();}
async function lock(){try{if('wakeLock'in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function start(){if(done){done=false;round=1;left=dur;}beep(1,1,0);running=true;endAt=Date.now()+left*1000;tick=setInterval(loop,100);lock();if(window.Android)Android.keepOn(true);draw();}
function pause(){running=false;clearInterval(tick);left=Math.ceil((endAt-Date.now())/1000);if(wl){wl.release();wl=null}if(window.Android)Android.keepOn(false);draw();}
$('start').onclick=()=>running?pause():start();
$('reset').onclick=()=>{if(running)pause();left=dur;round=1;done=false;lastBeep=-1;draw();};
function save(){try{localStorage.setItem('it_dur',dur);localStorage.setItem('it_step',STEP);localStorage.setItem('it_sets',sets);}catch(e){}}
function adj(d){dur=Math.min(MAX,Math.max(STEP,dur+d));if(!running){left=dur;}save();draw();}
function setStep(st){STEP=st;if(st==60){dur=Math.min(MAX,Math.max(60,Math.round(dur/60)*60));if(!running)left=dur;}save();draw();}
$('sets').oninput=e=>{sets=+e.target.value;if(round>sets&&!done)round=sets;save();draw();};
$('s30').onclick=()=>setStep(30);$('s60').onclick=()=>setStep(60);
try{const sd=+localStorage.getItem('it_dur'),ss=+localStorage.getItem('it_step');if(ss==30||ss==60)STEP=ss;if(sd>=STEP&&sd<=MAX)dur=left=sd;const sn=+localStorage.getItem('it_sets');if(sn>=1&&sn<=10)sets=sn;}catch(e){}
$('plus').onclick=()=>adj(STEP);$('minus').onclick=()=>adj(-STEP);
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')lock();});
const q=new URLSearchParams(location.search).get('test');if(q){dur=left=+q;}const qs=new URLSearchParams(location.search).get('sets');if(qs)sets=+qs;
draw();
</script><script>
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();var o=ac.createOscillator(),g=ac.createGain();g.gain.value=0;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.01);}catch(e){}}
['touchstart','touchend','click'].forEach(function(e){document.addEventListener(e,unlockAudio,{passive:true});});
document.addEventListener('visibilitychange',function(){if(!document.hidden){try{if(ac&&ac.state!=='running')ac.resume();}catch(e){} if(typeof running!=='undefined'&&running&&typeof lock==='function')lock();}});
</script>
<script>
/* iOS-robust audio: WAV data URIs via HTMLAudioElement, WebAudio fallback */
(function(){
function wav(parts){var sr=22050,tot=0;parts.forEach(function(p){tot+=Math.floor(sr*p[1]/1000)});var b=new ArrayBuffer(44+tot*2),v=new DataView(b);
function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
s(0,'RIFF');v.setUint32(4,36+tot*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,tot*2,true);
var o=44;parts.forEach(function(p){var n=Math.floor(sr*p[1]/1000);for(var i=0;i<n;i++){var env=Math.min(1,i/200,(n-i)/200);var x=p[0]?Math.sin(2*Math.PI*p[0]*i/sr)*0.9*env:0;v.setInt16(o,x*32767,true);o+=2}});
var u=new Uint8Array(b),bin='';for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'data:audio/wav;base64,'+btoa(bin)}
var SRC={tick:wav([[800,120]]),set:wav([[1000,250],[0,100],[1000,250],[0,100],[1400,600]]),fin:wav([[880,160],[0,20],[1100,160],[0,20],[1320,160],[0,20],[1760,1500]]),silent:wav([[0,50]])};
var A={},unlocked=false;window.__snd=[];
function el(k){if(!A[k]){var a=new Audio(SRC[k]);a.preload='auto';a.setAttribute('playsinline','');A[k]=a}return A[k]}
function osc(k){var m={tick:[[800,120]],set:[[1000,250,0],[1000,250,350],[1400,600,700]],fin:[[880,160,0],[1100,160,180],[1320,160,360],[1760,1500,560]]}[k];m.forEach(function(x){setTimeout(function(){window.__oscBeep(x[0],x[1],1)},x[2]||0)})}
function play(k){window.__snd.push(k);var a=el(k);try{a.pause();a.currentTime=0;a.muted=false;a.volume=1;var p=a.play();if(p&&p.catch)p.catch(function(){osc(k)})}catch(e){osc(k)}}
window.__oscBeep=beep;
window.unlockAll=function(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();var bf=ac.createBuffer(1,1,22050),bs=ac.createBufferSource();bs.buffer=bf;bs.connect(ac.destination);bs.start(0)}catch(e){}
 if(unlocked)return;unlocked=true;
 ['tick','set','fin'].forEach(function(k){var a=el(k);a.muted=true;try{var p=a.play();var f=function(){a.pause();a.currentTime=0;a.muted=false};if(p&&p.then)p.then(f,f);else f()}catch(e){}});
};
beep=function(f,ms,vol){if(!vol)return;play('tick')};
bigBeep=function(){play('set');if(navigator.vibrate)try{navigator.vibrate([400,150,400,150,600])}catch(e){}};
finishSound=function(){play('fin');if(navigator.vibrate)try{navigator.vibrate([600,200,600,200,1200])}catch(e){}};
var st=$('start');st.onclick=null;st.addEventListener('click',function(){unlockAll();running?pause():start()});
['touchstart','touchend','click'].forEach(function(e){document.addEventListener(e,unlockAll,{passive:true,capture:true})});
var tb=document.createElement('button');tb.id='testsnd';tb.textContent='🔊 Test sound';tb.style.cssText='display:block;margin:3vw auto;font-size:5vw;padding:2.5vw 6vw;border-radius:3vw;border:0;background:#2962ff;color:#fff';
tb.addEventListener('click',function(){unlockAll();setTimeout(function(){play('set')},80)});
var r=st.parentNode;r.parentNode.insertBefore(tb,r.nextSibling);
})();
</script>
</body></html>
